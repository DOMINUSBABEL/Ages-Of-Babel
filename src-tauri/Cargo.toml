[package]
name = "ages-of-babel"
version = "1.0.0"
description = "Ages of Babel - Idle 4X Strategy Game with Desktop Taskbar Widget & Steam Integration"
authors = ["DOMINUSBABEL"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5" }

[dependencies]
tauri = { version = "1.5", features = ["api-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3", features = ["winuser", "windef", "impl-default", "shellapi"] }

[features]
# default to custom-protocol for bundle, and dev-path for dev
default = [ "custom-protocol" ]
custom-protocol = [ "tauri/custom-protocol" ]
